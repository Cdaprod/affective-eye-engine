name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release identity
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run render
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run render:cinematic
      - run: |
          mkdir -p dist/artifacts
          cp -R artifacts/. dist/artifacts/
          tar -czf affective-eye-engine-site.tar.gz -C dist .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" affective-eye-engine-site.tar.gz --verify-tag --generate-notes
