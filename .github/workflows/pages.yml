name: Validate, render, and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: eye-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate behavior
        run: npm test
      - name: Validate social behavior lab
        run: npm run lab
      - name: Render deterministic assets
        run: npm run render
      - name: Build multi-page inspector
        run: npm run build
      - name: Install headless Chromium for real WebGL screenshots
        run: npx playwright install chromium --with-deps
      - name: Capture cinematic renders (WebGL browser)
        run: npm run render:cinematic
      - name: Verify published HTML and generated assets
        run: |
          test -s dist/index.html
          test -s dist/gallery.html
          test -s artifacts/lab-report.json
          test -s artifacts/contact-sheet.svg
          test -s artifacts/animations/attention-switch.svg
          test -s artifacts/cinematic/cinematic-neutral.png
          test -s artifacts/cinematic/glass-material.png
          test -s artifacts/cinematic/portrait.png
          test -s artifacts/cinematic/svg-fallback.png
          mkdir -p dist/artifacts
          cp -R artifacts/. dist/artifacts/
          test -s dist/artifacts/animations/attention-switch.svg
          test -s dist/artifacts/cinematic/cinematic-neutral.png
      - uses: actions/upload-artifact@v4
        with:
          name: eye-preview-artifacts
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy (requires Settings → Pages → GitHub Actions)
        uses: actions/deploy-pages@v4
        id: deployment
